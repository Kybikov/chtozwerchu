name: Game checks
on:
  push:
    branches: [master, feat/music-studio]
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
  server:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: khz_test
          POSTGRES_PASSWORD: integration_fixture_only
          POSTGRES_DB: khz_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U khz_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      KHZ_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      KHZ_TEST_DATABASE_URL: postgres://khz_test:integration_fixture_only@127.0.0.1:5432/khz_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: server/go.sum
      - run: go test -race ./...
      - run: go vet ./...
